<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS — Daily Planner & Micro-Sprints</title>
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: #151c2c;
            --accent-primary: #38bdf8;
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --accent-danger: #f87171;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding: 16px; max-width: 480px; margin: 0 auto; }

        /* Quick Sprint Banner */
        .sprint-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
        }

        .sprint-btn {
            background: var(--accent-primary);
            color: #090d16;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: transform 0.1s ease;
        }
        .sprint-btn:active { transform: scale(0.98); }

        /* Tasks List */
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
        
        .task-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-info { flex-grow: 1; }
        .task-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
        .task-meta { font-size: 0.8rem; color: var(--text-muted); }

        /* Progress Dots (1 dot = 15 min) */
        .chunks-container { display: flex; gap: 4px; margin-top: 6px; }
        .chunk-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: #273549;
        }
        .chunk-dot.filled { background: var(--accent-primary); }
        .chunk-dot.done { background: var(--accent-success); }

        .btn-add-chunk {
            background: #273549;
            border: none;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-left: 8px;
        }

        /* Timer Modal Overlay */
        .timer-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.95);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .timer-overlay.active { display: flex; }
        .timer-display { font-size: 4rem; font-weight: 900; color: var(--accent-primary); margin: 20px 0; }
    </style>
</head>
<body>

    <!-- 15-MINUTE SPRINT ENGINE -->
    <div class="sprint-card">
        <div style="font-size: 0.85rem; color: var(--accent-primary); font-weight: 700; text-transform: uppercase;">Є вільне вікно?</div>
        <h2 style="margin-top:4px;">15-Хвилинний Спринт</h2>
        <button class="sprint-btn" onclick="Planner.startAutoSprint()">⚡ Спланувати 15 хвилин</button>
    </div>

    <!-- DAILY PLAN -->
    <div class="section-title">📌 План на сьогодні</div>
    <div id="tasks-list"></div>

    <!-- TIMER OVERLAY -->
    <div id="timer-modal" class="timer-overlay">
        <div style="font-size: 1.1rem; color: var(--text-muted);">Зараз робимо:</div>
        <h1 id="timer-task-name" style="color: var(--text-main); text-align: center; margin-top: 8px;">--</h1>
        <div id="timer-countdown" class="timer-display">15:00</div>
        <button class="sprint-btn" style="background: var(--accent-success);" onclick="Planner.completeSprint()">✅ Завершити раніше (+15 хв)</button>
        <button class="sprint-btn" style="background: transparent; color: var(--accent-danger); margin-top: 8px;" onclick="Planner.cancelSprint()">Скасувати</button>
    </div>

    <script>
        const Planner = (() => {
            // Data Structure: 1 Chunk = 15 Minutes
            const DEFAULT_TASKS = [
                { id: 'code', name: '💻 Робота / Кодинг', totalChunks: 8, doneChunks: 0, category: 'work' },
                { id: 'clean', name: '🧹 Прибирання (швидке)', totalChunks: 2, doneChunks: 0, category: 'house' },
                { id: 'shop', name: '🛒 Похід в магазин', totalChunks: 2, doneChunks: 0, category: 'house' },
                { id: 'cook', name: '🍳 Готування їжі', totalChunks: 3, doneChunks: 0, category: 'house' },
                { id: 'read', name: '📚 Читання / Навчання', totalChunks: 2, doneChunks: 0, category: 'self' }
            ];

            let state = {
                tasks: [],
                activeSprint: null
            };

            let timerInterval = null;
            let timeLeftSeconds = 15 * 60;

            function init() {
                const saved = localStorage.getItem('lifeos_planner_state');
                state.tasks = saved ? JSON.parse(saved) : DEFAULT_TASKS;
                render();
            }

            function save() {
                localStorage.setItem('lifeos_planner_state', JSON.stringify(state.tasks));
                render();
            }

            function render() {
                const container = document.getElementById('tasks-list');
                container.innerHTML = state.tasks.map(task => {
                    const isCompleted = task.doneChunks >= task.totalChunks;
                    
                    // Generate visual 15-min dots
                    let dotsHTML = '';
                    for (let i = 0; i < task.totalChunks; i++) {
                        const isDone = i < task.doneChunks;
                        dotsHTML += `<div class="chunk-dot ${isDone ? 'done' : ''}"></div>`;
                    }

                    return `
                        <div class="task-card" style="opacity: ${isCompleted ? 0.5 : 1}">
                            <div class="task-info">
                                <div class="task-name">${isCompleted ? '✅ ' : ''}${task.name}</div>
                                <div class="task-meta">${task.doneChunks * 15} / ${task.totalChunks * 15} хв накопичено</div>
                                <div class="chunks-container">${dotsHTML}</div>
                            </div>
                            <button class="btn-add-chunk" onclick="Planner.addChunk('${task.id}')">+15 хв</button>
                        </div>
                    `;
                }).join('');
            }

            function addChunk(taskId) {
                const task = state.tasks.find(t => t.id === taskId);
                if (task) {
                    task.doneChunks++;
                    save();
                }
            }

            // Algorithmic selection: Знаходить невиконану задачу з найбільшим пріоритетом
            function startAutoSprint() {
                const pendingTask = state.tasks.find(t => t.doneChunks < t.totalChunks);
                if (!pendingTask) {
                    alert('🎉 Усі плани на сьогодні виконано! Відпочивай.');
                    return;
                }
                runTimerForTask(pendingTask);
            }

            function runTimerForTask(task) {
                state.activeSprint = task;
                document.getElementById('timer-task-name').innerText = task.name;
                document.getElementById('timer-modal').classList.add('active');
                
                timeLeftSeconds = 15 * 60;
                updateTimerDisplay();

                timerInterval = setInterval(() => {
                    timeLeftSeconds--;
                    updateTimerDisplay();
                    if (timeLeftSeconds <= 0) {
                        completeSprint();
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                const min = Math.floor(timeLeftSeconds / 60).toString().padStart(2, '0');
                const sec = (timeLeftSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-countdown').innerText = `${min}:${sec}`;
            }

            function completeSprint() {
                clearInterval(timerInterval);
                if (state.activeSprint) {
                    addChunk(state.activeSprint.id);
                    state.activeSprint = null;
                }
                document.getElementById('timer-modal').classList.remove('active');
            }

            function cancelSprint() {
                clearInterval(timerInterval);
                state.activeSprint = null;
                document.getElementById('timer-modal').classList.remove('active');
            }

            return { init, addChunk, startAutoSprint, completeSprint, cancelSprint };
        })();

        document.addEventListener('DOMContentLoaded', Planner.init);
    </script>
</body>
</html>
